    function toggleLearningTask(planId, taskIdx) {
      const items = DB.get('learning');
      const idx = items.findIndex(l => l.id === planId);
      if (idx >= 0 && items[idx].tasks && items[idx].tasks[taskIdx]) {
        items[idx].tasks[taskIdx].done = !items[idx].tasks[taskIdx].done;
        items[idx].progress = calcLearningProgress(items[idx].tasks);
        if (items[idx].progress === 100) items[idx].status = '已完成';
        else if (items[idx].progress > 0 && items[idx].status === '未开始') items[idx].status = '进行中';
        DB.set('learning', items);
        // 重新打开详情
        Modal.hide();
        showLearningDetail(planId);
        renderLearning();
      }
    }

    function incrementRepeatTask(planId, taskIdx) {
      const items = DB.get('learning');
      const idx = items.findIndex(l => l.id === planId);
      if (idx >= 0 && items[idx].tasks && items[idx].tasks[taskIdx]) {
        const task = items[idx].tasks[taskIdx];
        if (task.completed < task.total) {
          task.completed++;
          if (task.completed >= task.total) task.done = true;
        }
        items[idx].progress = calcLearningProgress(items[idx].tasks);
        if (items[idx].progress === 100) items[idx].status = '已完成';
        else if (items[idx].progress > 0 && items[idx].status === '未开始') items[idx].status = '进行中';
        DB.set('learning', items);
        Modal.hide();
        showLearningDetail(planId);
        renderLearning();
        if (task.completed >= task.total) showToast('🎉 重复任务完成！');
        else showToast(`🔄 ${task.completed}/${task.total} 已完成`);
      }
    }

    function decrementRepeatTask(planId, taskIdx) {
      const items = DB.get('learning');
      const idx = items.findIndex(l => l.id === planId);
      if (idx >= 0 && items[idx].tasks && items[idx].tasks[taskIdx]) {
        const task = items[idx].tasks[taskIdx];
        if (task.completed > 0) {
          task.completed--;
          task.done = false;
        }
        items[idx].progress = calcLearningProgress(items[idx].tasks);
        items[idx].status = items[idx].progress === 100 ? '已完成' : '进行中';
        DB.set('learning', items);
        Modal.hide();
        showLearningDetail(planId);
        renderLearning();
      }

    function updateEditLearningTopicOptions() {
      const dim = document.getElementById('elDimension').value;

      document.getElementById('elTopic').innerHTML = topics.map(t => `<option value="${t}">${t}</option>`).join('');

    function updateLearning(id) {
      const items = DB.get('learning');
      const idx = items.findIndex(l => l.id === id);
      if (idx >= 0) {
        const tasksText = document.getElementById('elTasks').value.trim();
        const newTasks = parseLearningTasks(tasksText);
        // 保留已完成的子任务状态
        const oldTasks = items[idx].tasks || [];
        newTasks.forEach(nt => {
          const oldMatch = oldTasks.find(ot => ot.text === nt.text);
          if (oldMatch) {
            if (nt.type === 'repeat') {
              nt.completed = oldMatch.completed || 0;
              nt.done = nt.completed >= nt.total;
            } else {
              nt.done = oldMatch.done || false;
            }
          }
        });
        const progress = calcLearningProgress(newTasks);
        items[idx].title = document.getElementById('elTitle').value.trim();
        items[idx].dimension = document.getElementById('elDimension').value;
        items[idx].topic = document.getElementById('elTopic').value;
        items[idx].minAction = document.getElementById('elMinAction').value.trim();
        items[idx].tasks = newTasks;
        items[idx].progress = progress;
        items[idx].status = document.getElementById('elStatus').value;
        if (progress === 100) items[idx].status = '已完成';
        else if (progress > 0 && items[idx].status === '未开始') items[idx].status = '进行中';
        items[idx].note = document.getElementById('elNote').value.trim();
        items[idx].resourceUrl = document.getElementById('elResourceUrl').value.trim();
        DB.set('learning', items);
        Modal.hide();
        renderLearning();
        showToast('已更新');
      }
    }

    function saveSideWeeklyLog(id) {
      const items = DB.get('sidehustle');
      const idx = items.findIndex(s => s.id === id);
      if (idx < 0) return;
      const fans = document.getElementById('logFans').value;
      const posts = document.getElementById('logPosts').value;
      const income = document.getElementById('logIncome').value;
      const other = document.getElementById('logOther').value.trim();
      // 计算当前周号
      const now = new Date();
      const weekNum = `W${Math.ceil((now.getDate() + new Date(now.getFullYear(), now.getMonth(), 1).getDay()) / 7)} ${now.getMonth()+1}月`;
      const metrics = {};
      if (fans) metrics['粉丝'] = fans;
      if (posts) metrics['发布'] = posts;
      if (other) metrics['其他'] = other;
      if (!items[idx].weeklyLogs) items[idx].weeklyLogs = [];
      items[idx].weeklyLogs.push({
        week: weekNum,
        date: Utils.todayStr(),
        metrics,
        income: income || '0'
      });
      // 更新累计实际收入
      const totalIncome = items[idx].weeklyLogs.reduce((sum, l) => sum + (parseFloat(l.income) || 0), 0);
      items[idx].actualIncome = totalIncome.toString();
      DB.set('sidehustle', items);
      Modal.hide();
      renderSidehustle();
      showToast('📝 本周进度已记录');
    }

    function toggleSideTask(planId, taskIdx) {
      const items = DB.get('sidehustle');
      const idx = items.findIndex(s => s.id === planId);
      if (idx >= 0 && items[idx].tasks && items[idx].tasks[taskIdx]) {
        items[idx].tasks[taskIdx].done = !items[idx].tasks[taskIdx].done;
        items[idx].progress = calcLearningProgress(items[idx].tasks);
        if (items[idx].progress === 100) items[idx].status = '已完成';
        else if (items[idx].progress > 0 && items[idx].status === '规划中') items[idx].status = '进行中';
        DB.set('sidehustle', items);
        Modal.hide();
        showSidehustleDetail(planId);
        renderSidehustle();
      }
    }

    function incrementSideRepeatTask(planId, taskIdx) {
      const items = DB.get('sidehustle');
      const idx = items.findIndex(s => s.id === planId);
      if (idx >= 0 && items[idx].tasks && items[idx].tasks[taskIdx]) {
        const task = items[idx].tasks[taskIdx];
        if (task.completed < task.total) {
          task.completed++;
          if (task.completed >= task.total) task.done = true;
        }
        items[idx].progress = calcLearningProgress(items[idx].tasks);
        if (items[idx].progress === 100) items[idx].status = '已完成';
        else if (items[idx].progress > 0 && items[idx].status === '规划中') items[idx].status = '进行中';
        DB.set('sidehustle', items);
        Modal.hide();
        showSidehustleDetail(planId);
        renderSidehustle();
        showToast(`🔄 ${task.completed}/${task.total} 已完成`);
      }
    }

    function decrementSideRepeatTask(planId, taskIdx) {
      const items = DB.get('sidehustle');
      const idx = items.findIndex(s => s.id === planId);
      if (idx >= 0 && items[idx].tasks && items[idx].tasks[taskIdx]) {
        const task = items[idx].tasks[taskIdx];
        if (task.completed > 0) { task.completed--; task.done = false; }
        items[idx].progress = calcLearningProgress(items[idx].tasks);
        DB.set('sidehustle', items);
        Modal.hide();
        showSidehustleDetail(planId);
        renderSidehustle();
      }
    }

    function updateSideIncome(id) {
      const items = DB.get('sidehustle');
      const idx = items.findIndex(s => s.id === id);
      if (idx >= 0) {
        items[idx].actualIncome = document.getElementById('sideIncomeUpdate').value;

    function addSideHabit(planId) {
      const input = document.getElementById('newSideHabit');
      const text = input.value.trim();
      if (!text) { showToast('请输入习惯名称'); return; }
      const items = DB.get('sidehustle');

      }

    function checkinSideHabit(planId, habitIdx) {
      const today = Utils.todayStr();
      const items = DB.get('sidehustle');
      const idx = items.findIndex(s => s.id === planId);
      if (idx >= 0 && items[idx].dailyHabits && items[idx].dailyHabits[habitIdx]) {
        const habit = items[idx].dailyHabits[habitIdx];
        if (!habit.checkins) habit.checkins = [];
        if (habit.checkins.includes(today)) { showToast('今天已打卡 ✅'); return; }
        habit.checkins.push(today);
        DB.set('sidehustle', items);
        Modal.hide();
        showSidehustleDetail(planId);
        renderSidehustle();
        const streak = calcSideHabitStreak(habit.checkins);
        showToast(`🎯 习惯打卡成功！连续${streak}天`);
      }
    }

    function calcSideHabitStreak(checkins) {
      if (!checkins || checkins.length === 0) return 0;
      const dates = [...new Set(checkins)].sort().reverse();
      let streak = 0;
      let checkDate = Utils.todayStr();
      for (const d of dates) {
        if (d === checkDate) { streak++; checkDate = getPrevDay(checkDate); }
        else if (d === getPrevDay(checkDate)) { streak++; checkDate = getPrevDay(checkDate); }
        else break;
      }
      return streak;
    }

    function updateSidehustle(id) {
      const title = document.getElementById('esTitle').value.trim();
      if (!title) { showToast('请输入名称'); return; }
      const items = DB.get('sidehustle');
      const idx = items.findIndex(s => s.id === id);
      if (idx >= 0) {
        const tasksText = document.getElementById('esTasks').value.trim();
        const newTasks = parseLearningTasks(tasksText);
        // 保留已有完成状态
        const oldTasks = items[idx].tasks || [];
        newTasks.forEach(nt => {
          const oldMatch = oldTasks.find(ot => ot.text === nt.text);
          if (oldMatch) {
            if (nt.type === 'repeat') { nt.completed = oldMatch.completed || 0; nt.done = nt.completed >= nt.total; }
            else { nt.done = oldMatch.done || false; }
          }
        });
        items[idx].title = title;
        items[idx].type = document.getElementById('esType').value;
        items[idx].platform = document.getElementById('esPlatform').value;
        items[idx].phase = document.getElementById('esPhase').value;
        items[idx].goal = document.getElementById('esGoal').value.trim();
        items[idx].minAction = document.getElementById('esMinAction').value.trim();
        items[idx].tasks = newTasks;
        items[idx].progress = calcLearningProgress(newTasks);
        items[idx].status = document.getElementById('esStatus').value;
        items[idx].expectedIncome = document.getElementById('esIncome').value;
        items[idx].weeklyHours = document.getElementById('esWeeklyHours').value;
        DB.set('sidehustle', items);
        Modal.hide();
        renderSidehustle();
        showToast('已更新');
      }
    }

    // 保存到云端：把所有penny_开头的localStorage数据打包上传到GitHub仓库
    // ========== 同步数据加密/解密 ==========
    // 用App密码作为加密密钥，XOR+Base64加密
    function encryptData(plainText, key) {
      if (!key) key = 'penny_default_key_2026';
      const result = [];
      for (let i = 0; i < plainText.length; i++) {
        const charCode = plainText.charCodeAt(i) ^ key.charCodeAt(i % key.length);
        result.push(String.fromCharCode(charCode));
      }
      // 加上标记前缀，标识这是加密数据
      return 'ENC:' + btoa(unescape(encodeURIComponent(result.join(''))));
    }

    function decryptData(encText, key) {
      if (!key) key = 'penny_default_key_2026';
      // 检查是否是加密格式
      if (!encText.startsWith('ENC:')) {
        // 旧版未加密数据，直接返回
        return encText;
      }
      try {
        const encBody = encText.substring(4);
        const decoded = decodeURIComponent(escape(atob(encBody)));
        const result = [];
        for (let i = 0; i < decoded.length; i++) {
          const charCode = decoded.charCodeAt(i) ^ key.charCodeAt(i % key.length);
          result.push(String.fromCharCode(charCode));
        }
        return result.join('');
      } catch (e) {
        throw new Error('解密失败，密码可能不正确');
      }
    }

    // 获取加密密钥（用App密码，如果没有则用默认密钥）
    function getSyncKey() {
      // 不直接用密码，而是用密码的hash作为密钥，更安全
      const lock = localStorage.getItem('penny_app_lock');
      if (lock) return lock;
      return 'penny_default_key_2026';
    }

    function saveToCloud() {
      const token = localStorage.getItem('penny_github_token');
      if (!token) { showToast('请先连接GitHub'); return; }

      showToast('⬆️ 正在保存到云端…');

      // 收集所有数据
      const allData = {};
      const dbKeys = ['customers','projects','todos','industry','inspirations','materials','trends','learning','sidehustle','schedule','healthRecords','waterRecords','learningCheckins'];
      dbKeys.forEach(k => {
        const val = DB.get(k);
        if (val && (Array.isArray(val) && val.length > 0) || (typeof val === 'object' && Object.keys(val).length > 0)) {
          allData[k] = val;
        }
      });

      // 也保存打卡、单词等数据
      const extraKeys = ['penny_dailyVocab','penny_knownVocab','penny_dailyQuote','penny_checkin_date','penny_visit_streak','penny_last_visit','penny_side_templates_created'];
      extraKeys.forEach(k => {
        const val = localStorage.getItem(k);
        if (val) allData[k] = JSON.parse(val);
      });

      allData._syncTime = new Date().toISOString();
      allData._version = localStorage.getItem('penny_version');

      const jsonStr = JSON.stringify(allData);
      // 加密数据
      const encStr = encryptData(jsonStr, getSyncKey());

      // 获取文件当前SHA（如果存在）
      fetch(`https://api.github.com/repos/penny858/penny-app/contents/sync_data.json?ref=main`, {
        headers: { Authorization: `token ${token}`, Accept: 'application/vnd.github.v3+json' }
      })
      .then(r => {
        if (r.status === 200) return r.json().then(d => d.sha);
        return null; // 文件不存在
      })
      .then(sha => {
        // 上传/更新文件（加密后的内容）
        const body = {
          message: `☁️ 云端同步(已加密) - ${new Date().toLocaleString('zh-CN')}`,
          content: btoa(unescape(encodeURIComponent(encStr))),
          branch: 'main'
        };
        if (sha) body.sha = sha;

        return fetch(`https://api.github.com/repos/penny858/penny-app/contents/sync_data.json`, {
          method: 'PUT',
          headers: { Authorization: `token ${token}`, 'Content-Type': 'application/json', Accept: 'application/vnd.github.v3+json' },
          body: JSON.stringify(body)
        });
      })
      .then(r => r.json())
      .then(d => {
        if (d.content) {
          localStorage.setItem('penny_last_sync', new Date().toLocaleString('zh-CN'));
          localStorage.setItem('penny_sync_direction', 'upload');
          const sizeKB = Math.round(jsonStr.length / 1024);
          showToast(`✅ 保存成功！云端数据 ${sizeKB}KB`);
          renderSettings();
        } else {
          showToast(`❌ 保存失败: ${d.message || '未知错误'}`);
        }
      })
      .catch(e => showToast(`❌ 网络错误: ${e.message}`));
    }

    // 从云端同步：下载GitHub仓库的sync_data.json，覆盖本地数据
    function syncFromCloud() {
      const token = localStorage.getItem('penny_github_token');
      if (!token) { showToast('请先连接GitHub'); return; }

      showToast('⬇️ 正在从云端同步…');

      fetch(`https://api.github.com/repos/penny858/penny-app/contents/sync_data.json?ref=main`, {
        headers: { Authorization: `token ${token}`, Accept: 'application/vnd.github.v3+json' }
      })
      .then(r => {
        if (r.status === 404) throw new Error('云端暂无数据，请先在一台设备上「保存到云端」');
        return r.json();
      })
      .then(d => {
        const rawStr = decodeURIComponent(escape(atob(d.content)));
        // 解密数据
        const jsonStr = decryptData(rawStr, getSyncKey());
        const allData = JSON.parse(jsonStr);

        // 覆盖本地数据
        const dbKeys = ['customers','projects','todos','industry','inspirations','materials','trends','learning','sidehustle','schedule','healthRecords','waterRecords','learningCheckins'];
        dbKeys.forEach(k => {
          if (allData[k]) DB.set(k, allData[k]);
        });

        // 恢复额外数据
        const extraKeys = ['penny_dailyVocab','penny_knownVocab','penny_dailyQuote','penny_checkin_date','penny_visit_streak','penny_last_visit','penny_side_templates_created'];
        extraKeys.forEach(k => {
          if (allData[k]) localStorage.setItem(k, JSON.stringify(allData[k]));
        });

        localStorage.setItem('penny_last_sync', new Date().toLocaleString('zh-CN'));
        localStorage.setItem('penny_sync_direction', 'download');

        // 刷新页面
        const sizeKB = Math.round(jsonStr.length / 1024);
        showToast(`✅ 同步成功！已恢复 ${sizeKB}KB 数据，页面即将刷新`);
        setTimeout(() => { location.reload(); }, 1500);
      })
      .catch(e => showToast(`❌ 同步失败: ${e.message}`));
    }

    // 本地导出
    function exportLocalData() {
      const allData = {};
      const dbKeys = ['customers','projects','todos','industry','inspirations','materials','trends','learning','sidehustle','schedule','healthRecords','waterRecords','learningCheckins'];
      dbKeys.forEach(k => { const v = DB.get(k); if (v) allData[k] = v; });
      const extraKeys = ['penny_dailyVocab','penny_knownVocab','penny_checkin_date','penny_visit_streak','penny_last_visit','penny_side_templates_created'];
      extraKeys.forEach(k => { const v = localStorage.getItem(k); if (v) allData[k] = JSON.parse(v); });
      allData._exportTime = new Date().toISOString();

      const blob = new Blob([JSON.stringify(allData, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `penny_backup_${Utils.todayStr()}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('📤 备份文件已下载');
    }

    // 本地导入
    function importLocalData() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.json';
      input.onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const allData = JSON.parse(ev.target.result);
            const dbKeys = ['customers','projects','todos','industry','inspirations','materials','trends','learning','sidehustle','schedule','healthRecords','waterRecords','learningCheckins'];
            dbKeys.forEach(k => { if (allData[k]) DB.set(k, allData[k]); });
            const extraKeys = ['penny_dailyVocab','penny_knownVocab','penny_checkin_date','penny_visit_streak','penny_last_visit','penny_side_templates_created'];
            extraKeys.forEach(k => { if (allData[k]) localStorage.setItem(k, JSON.stringify(allData[k])); });
            showToast('📥 数据已恢复，页面即将刷新');
            setTimeout(() => { location.reload(); }, 1500);
          } catch (err) {
            showToast('❌ 文件格式错误，请选择正确的备份文件');
          }
        };
        reader.readAsText(file);
      };
      input.click();
    }

    // ========== 每日行业推荐算法 ==========
    // 每天从INDUSTRY_NEWS_POOL中挑选5条热度高的推荐，按日期缓存
    function getDailyIndustry(forceRefresh) {
      const today = Utils.todayStr();
      const stored = localStorage.getItem('penny_dailyIndustry');
      let record = stored ? JSON.parse(stored) : null;
      if (!record || record.date !== today || forceRefresh) {
        // 从池中选取：优先高热度，覆盖不同维度
        const pool = typeof INDUSTRY_NEWS_POOL !== 'undefined' ? INDUSTRY_NEWS_POOL : [];
        if (pool.length === 0) return [];

        // 分类：高/中/低 importance
        const highItems = pool.filter(i => i.importance === '高');
        const medItems = pool.filter(i => i.importance === '中');
        const lowItems = pool.filter(i => i.importance === '低');

        // 优先选3条高热度，1条中热度，1条随机 - 覆盖不同tag维度
        const shuffle = arr => arr.sort(() => Math.random() - 0.5);
        const shuffledHigh = shuffle([...highItems]);
        const shuffledMed = shuffle([...medItems]);
        const shuffledLow = shuffle([...lowItems]);

        let selected = [];
        // 按维度分组选高热度
        const tagsCovered = new Set();
        for (const item of shuffledHigh) {
          if (selected.length >= 3) break;
          if (!tagsCovered.has(item.tag)) {
            selected.push(item);
            tagsCovered.add(item.tag);
          }
        }
        // 如果维度不够，补高热度
        for (const item of shuffledHigh) {
          if (selected.length >= 3) break;
          if (!selected.includes(item)) selected.push(item);
        }
        // 加1条中热度
        for (const item of shuffledMed) {
          if (selected.length >= 4) break;
          if (!selected.includes(item)) { selected.push(item); tagsCovered.add(item.tag); break; }
        }
        // 加1条随机
        const allRemaining = shuffle([...pool.filter(i => !selected.includes(i))]);
        if (allRemaining.length > 0) selected.push(allRemaining[0]);

        // 截断到5条
        selected = selected.slice(0, 5);

        record = { date: today, items: selected.map(i => i.title) };
        localStorage.setItem('penny_dailyIndustry', JSON.stringify(record));
      }

      // 从池中恢复完整对象
      const pool = typeof INDUSTRY_NEWS_POOL !== 'undefined' ? INDUSTRY_NEWS_POOL : [];
      return record.items.map(title => pool.find(i => i.title === title) || null).filter(Boolean);
    }

    function getDailyQuote(forceRefresh) {
      const today = Utils.todayStr();
      const stored = localStorage.getItem('penny_dailyQuote');
      let record = stored ? JSON.parse(stored) : null;
      if (!record || record.date !== today || forceRefresh) {
        const idx = Math.floor(Math.random() * QUOTES.length);
        record = { date: today, idx };
        localStorage.setItem('penny_dailyQuote', JSON.stringify(record));

      return QUOTES[record.idx];
    }

    function getPuppyQuote(streak) {
      const today = Utils.todayStr();
      const seed = today + streak;
      let hash = 0;
      for (let i = 0; i < seed.length; i++) hash = ((hash << 5) - hash) + seed.charCodeAt(i);
      const idx = Math.abs(hash) % PUPPY_QUOTES.length;
      let q = PUPPY_QUOTES[idx];
      if (q.text.includes('N')) q = { ...q, text: q.text.replace(/N/g, streak) };
      return q;
    }

    function calcVisitStreak() {
      const today = Utils.todayStr();
      const lastVisit = localStorage.getItem('penny_last_visit');
      let streak = parseInt(localStorage.getItem('penny_visit_streak') || '0', 10);
      if (lastVisit) {
        const yesterday = getPrevDay(today);
        if (lastVisit === today) {
          // 今天已经来过，streak不变
        } else if (lastVisit === yesterday) {
          // 昨天来过，今天第一次来，streak+1（在checkin时处理）
        } else {
          // 断签超过一天，重置
          streak = 0;
        }
      } else {
        streak = 0;
      }
      return streak;
    }

    function checkinDailyVisit() {
      const today = Utils.todayStr();
      const lastVisit = localStorage.getItem('penny_last_visit');
      let streak = parseInt(localStorage.getItem('penny_visit_streak') || '0', 10);
      const yesterday = getPrevDay(today);

      if (lastVisit === today) {
        // 今天已经打过卡了
        showToast('今天已经打过卡啦，小狗超开心 🐶');
        return;
      }

      if (lastVisit === yesterday) {
        streak += 1;
      } else {
        streak = 1;
      }

      localStorage.setItem('penny_last_visit', today);
      localStorage.setItem('penny_checkin_date', today);
      localStorage.setItem('penny_visit_streak', streak.toString());

      updatePuppyCheckinBar();

      // 打卡音效/震动

      if (streak === 1) showToast('🐾 第一天打卡成功！小狗记住你啦');

    // 统计今日行动：学习计划打卡、副业习惯打卡、灵感收集、新增素材等
    function getTodayActionSummary() {
      const today = Utils.todayStr();
      let done = 0, total = 0;

      // 学习计划子任务
      const learning = DB.get('learning') || [];
      learning.forEach(l => {
        (l.tasks || []).forEach(t => {
          total++;
          if (isTaskDone(t)) done++;
        });
      });

      // 副业计划子任务
      const sidehustle = DB.get('sidehustle') || [];
      sidehustle.forEach(s => {
        (s.tasks || []).forEach(t => {
          total++;
          if (isTaskDone(t)) done++;
        });
      });

      // 学习计划每日习惯今日打卡
      learning.forEach(l => {
        (l.dailyHabits || []).forEach(h => {
          total++;
          if ((h.checkins || []).includes(today)) done++;
        });
      });

      // 副业计划每日习惯今日打卡
      sidehustle.forEach(s => {
        (s.dailyHabits || []).forEach(h => {
          total++;
          if ((h.checkins || []).includes(today)) done++;
        });
      });

      return { done, total };
    }

    function migrateCustomers() {
      const migrationKey = 'penny_customerMigration_v2';
      if (localStorage.getItem(migrationKey)) return; // 已迁移

      const customers = DB.get('customers');
      // 旧版 status → 新版 stage 映射
      const statusToStage = { '线索': '线索', '跟进中': '初触', '成交': '成交', '流失': '线索' };

      customers.forEach(c => {
        if (c.status && !c.stage) {
          c.stage = statusToStage[c.status] || '线索';
          delete c.status;
        }
        if (typeof c.probability === 'string') {
          c.probability = Number(c.probability) || 0;
        }
        if (!c.updatedAt) {
          c.updatedAt = c.createdAt || new Date().toISOString();
        }
        // 补充新字段默认值
        if (!c.industry) c.industry = '';
        if (!c.position) c.position = '';
        if (!c.decisionPower) c.decisionPower = '';
        if (!c.budgetLevel) c.budgetLevel = '';
        if (!c.commPreference) c.commPreference = '';
        if (!c.source) c.source = '';
        if (!c.painPoints) c.painPoints = '';
        if (!c.nextFollowDate) c.nextFollowDate = '';
      });
      DB.set('customers', customers);

      // 迁移跟进记录
      const followups = DB.get('customerFollowups');
      followups.forEach(f => {
        if (!f.feedback) f.feedback = '';
        if (!f.stageAdvanced) f.stageAdvanced = false;
        if (!f.nextFollowDate) f.nextFollowDate = '';
        // nextAction → content (合并旧字段)
        if (f.nextAction && !f.content.includes(f.nextAction)) {
          f.content = f.content + '\n📌 下一步: ' + f.nextAction;
          delete f.nextAction;
        }
      });
      DB.set('customerFollowups', followups);

      localStorage.setItem(migrationKey, 'done');
    }

    // ========== App密码锁 ==========
    function hashPassword(pwd) {
      // 简单哈希：不存明文，防直接查看localStorage
      let hash = 0;
      const salt = 'penny_salt_2026';
      const str = salt + pwd + salt;
      for (let i = 0; i < str.length; i++) {
        hash = ((hash << 5) - hash) + str.charCodeAt(i);
        hash = hash & hash;
      }
      return 'h' + Math.abs(hash).toString(36);
    }

    function checkAppLock() {
      const savedHash = localStorage.getItem('penny_app_lock');
      if (!savedHash) {
        // 没设密码，显示设置密码界面
        showLockScreen(true);
      } else {
        // 有密码，显示解锁界面
        showLockScreen(false);
      }
    }

    function showLockScreen(isSetup) {
      const lock = document.getElementById('lockScreen');
      const subtitle = document.getElementById('lockSubtitle');
      const setup = document.getElementById('lockSetup');
      const hint = document.getElementById('lockHint');
      const input = document.getElementById('lockPassword');

      lock.style.display = 'flex';

      if (isSetup) {
        subtitle.textContent = '首次使用，请设置App密码';
        setup.style.display = 'block';
        hint.textContent = '';
      } else {
        subtitle.textContent = '请输入密码解锁';
        setup.style.display = 'none';
        hint.textContent = '';
      }

      // 自动聚焦输入框
      setTimeout(() => input.focus(), 100);

      // 回车键解锁
      input.onkeydown = (e) => {
        if (e.key === 'Enter') {
          if (isSetup) setAppPassword();
          else unlockApp();
        }
      };
      document.getElementById('lockPasswordConfirm').onkeydown = (e) => {
        if (e.key === 'Enter') setAppPassword();
      };
    }

    function unlockApp() {
      const savedHash = localStorage.getItem('penny_app_lock');
      const input = document.getElementById('lockPassword');
      const hint = document.getElementById('lockHint');
      const pwd = input.value;

      if (!pwd) { hint.textContent = '请输入密码'; return; }

      if (hashPassword(pwd) === savedHash) {
        // 解锁成功
        document.getElementById('lockScreen').style.display = 'none';
        input.value = '';
        hint.textContent = '';
      } else {
        hint.textContent = '❌ 密码错误，请重试';
        input.value = '';
        input.focus();
        // 震动效果
        if (navigator.vibrate) navigator.vibrate(100);
        // 抖动动画
        const container = document.querySelector('.lock-container');
        container.style.animation = 'none';
        setTimeout(() => { container.style.animation = 'puppyBounce 0.3s'; }, 10);
      }
    }

    function setAppPassword() {
      const pwd = document.getElementById('lockPassword').value;
      const confirm = document.getElementById('lockPasswordConfirm').value;
      const hint = document.getElementById('lockHint');

      if (!pwd) { hint.textContent = '请输入密码'; return; }
      if (pwd.length < 4) { hint.textContent = '密码至少4位'; return; }
      if (pwd !== confirm) { hint.textContent = '两次密码不一致'; return; }

      localStorage.setItem('penny_app_lock', hashPassword(pwd));
      document.getElementById('lockScreen').style.display = 'none';
      document.getElementById('lockPassword').value = '';
      document.getElementById('lockPasswordConfirm').value = '';
      hint.textContent = '';
      showToast('🔒 App密码已设置');
    }

    function changeAppPassword() {
      const savedHash = localStorage.getItem('penny_app_lock');
      if (!savedHash) { showToast('请先在设置中设置密码'); return; }
      const oldPwd = prompt('请输入当前密码：');
      if (!oldPwd) return;
      if (hashPassword(oldPwd) !== savedHash) { showToast('❌ 旧密码错误'); return; }
      const newPwd = prompt('请输入新密码（至少4位）：');
      if (!newPwd || newPwd.length < 4) { showToast('密码至少4位'); return; }
      const confirmPwd = prompt('再次输入新密码：');
      if (newPwd !== confirmPwd) { showToast('两次密码不一致'); return; }
      localStorage.setItem('penny_app_lock', hashPassword(newPwd));
      showToast('✅ 密码已修改');
    }

    function removeAppPassword() {
      const savedHash = localStorage.getItem('penny_app_lock');
      if (!savedHash) { showToast('当前没有设置密码'); return; }
      const pwd = prompt('请输入当前密码以关闭密码锁：');
      if (!pwd) return;
      if (hashPassword(pwd) !== savedHash) { showToast('❌ 密码错误'); return; }
      localStorage.removeItem('penny_app_lock');
      showToast('🔓 密码锁已关闭');
      renderSettings();
    }

    function init() {
      // 强制清除旧缓存（v21 密码锁+同步加密）
      if (localStorage.getItem('penny_version') !== 'v22') {
        localStorage.setItem('penny_version', 'v22');
        // 注销旧Service Worker
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(regs => {
            regs.forEach(reg => reg.unregister());
          });
        }
        // 清除Cache Storage
        if ('caches' in window) {
          caches.keys().then(names => {
            names.forEach(name => caches.delete(name));
          });
        }
      }

      // 首次访问自动创建所有副业模板（只执行一次）
      if (localStorage.getItem('penny_side_templates_created') !== 'yes') {
        createAllTemplates();
        localStorage.setItem('penny_side_templates_created', 'yes');
      }

      // 数据迁移
      migrateCustomers();

      // 强制加载Excel导入数据（覆盖旧数据，确保Excel数据生效）
      if (typeof EXCEL_IMPORTED_CUSTOMERS !== 'undefined' && EXCEL_IMPORTED_CUSTOMERS.length > 0) {
        const existingCustomers = DB.get('customers');
        // 如果没有数据，直接写入；如果有但不是Excel导入的，也写入（覆盖）
        if (existingCustomers.length === 0 || !existingCustomers.some(c => c.source === 'Excel导入')) {
          DB.set('customers', EXCEL_IMPORTED_CUSTOMERS);
          showToast('✅ 已加载 ' + EXCEL_IMPORTED_CUSTOMERS.length + ' 个客户数据');
        }
      }

      // 行业动态数据初始化：从情报池导入双语数据（清除旧版纯中文数据）
      const industryData = DB.get('industry');
      const hasOldData = industryData.some(i => !i.title.includes('/') && i.id && i.id.startsWith('ind_0'));
      if (industryData.length === 0 || hasOldData) {
        const pool = typeof INDUSTRY_NEWS_POOL !== 'undefined' ? INDUSTRY_NEWS_POOL : [];
        if (pool.length > 0) {
          // 从池中导入所有"高"+"中"热度条目作为初始数据（双语）
          const initialItems = pool.filter(i => i.importance === '高' || i.importance === '中').map((item, idx) => ({
            id: 'ind_v7_' + (idx + 1),
            title: item.title,
            summary: item.summary,
            tag: item.tag,
            importance: item.importance,
            readStatus: '未读',
            source: item.source,
            date: new Date(Date.now() - idx * 86400000).toISOString(),
            createdAt: new Date(Date.now() - idx * 86400000).toISOString()
          }));
          DB.set('industry', initialItems);
          if (hasOldData) showToast('🔄 已升级为双语行业情报');
          else showToast('✅ 已导入 ' + initialItems.length + ' 条行业情报');
        }
      }

      // 日期显示
      const now = new Date();
      document.getElementById('headerDate').textContent = `${now.getMonth()+1}月${now.getDate()}日 ${['日','一','二','三','四','五','六'][now.getDay()]}`;

      // 导航绑定
      document.querySelectorAll('.nav-item').forEach(el => {
        el.addEventListener('click', () => navigate(el.dataset.page));
      });

      // 菜单切换（移动端）
      document.getElementById('menuToggle').addEventListener('click', () => {
        document.getElementById('sidebar').classList.toggle('open');
      });
      document.getElementById('sidebarOverlay').addEventListener('click', () => {
        document.getElementById('sidebar').classList.remove('open');
      });

      // 模态框关闭
      document.getElementById('modalClose').addEventListener('click', Modal.hide);
      document.getElementById('modalOverlay').addEventListener('click', (e) => {
        if (e.target.id === 'modalOverlay') Modal.hide();
      });

      // 更新Badge
      updateBadges();

      // 每日金句
      renderDailyQuote();
      document.getElementById('quoteRefresh')?.addEventListener('click', () => {
        renderDailyQuote();
        const q = getDailyQuote(true);
        const el = document.getElementById('quoteContent');
        if (el) {
          el.innerHTML = `
            <div class="quote-cn">"${q.cn}"</div>
            <div class="quote-en">${q.en}</div>
          `;
        }
        showToast('金句已更新');
      });

      // 渲染首页
      renderHome();

      // 小狗打卡系统：记录访问并更新提示条
      const visitStatus = getDailyVisitStatus();
      const today = Utils.todayStr();
      if (visitStatus.lastVisit !== today) {
        // 更新最后访问日期（注意：streak 在打卡时才算）
        localStorage.setItem('penny_last_visit', today);
      }
      updatePuppyCheckinBar();
      // 如果今天还没打卡，3秒后自动弹出欢迎弹窗（给用户先看页面的时间）
      if (!visitStatus.checkedIn) {
        setTimeout(() => showDailyWelcome(), 1200);
      }

      // 强制清除旧缓存并重新注册Service Worker
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(regs => {
          // 先注销所有旧的Service Worker
          Promise.all(regs.map(reg => reg.unregister())).then(() => {
            // 清除所有caches
            caches.keys().then(names => {
              Promise.all(names.map(name => caches.delete(name))).then(() => {
                // 重新注册新的SW
                navigator.serviceWorker.register('sw.js?v=22').then(reg => {
                  console.log('SW v5 registered');
                }).catch(err => console.log('SW注册失败:', err));
              });
            });
          });
        }).catch(() => {
          navigator.serviceWorker.register('sw.js?v=22');
        });
      }

      // 添加到桌面提示
      let deferredPrompt;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        if (!localStorage.getItem('penny_install_dismissed')) {
          setTimeout(() => {
            if (confirm('📲 将Penny的工作台添加到桌面？\n\n安装后可以像App一样使用，体验更好。')) {
              deferredPrompt.prompt();
            } else {
              localStorage.setItem('penny_install_dismissed', '1');
            }
          }, 3000);
        }
      });

      // 检查App密码锁（最后执行，确保页面加载完成后再锁屏）
      checkAppLock();
    }

    // 启动
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>
</body>
</html>
